# Absent from the 10.x schema -- mDNS moved to the site-level "mdns"
# setting -- but the network object never stopped carrying it. Measured
# on 10.6.101: a networkconf create with mdns_enabled true stores it and
# reads it back, and TestIntegrationV1Drift names it as unmodelled the
# moment this pin is dropped. So this is not a compatibility shim; the
# published schema is simply silent about a field the controller honors,
# and the encoder's corporate and vlan-only purposes send it.
[Network.field.mdns_enabled]
add = true
doc = "Multicast DNS on this network. The controller stores and returns it (measured on 10.6.101) but publishes no schema for it, so it carries no validation."
name = "MdnsEnabled"
type = "bool"

# Serialized unconditionally, so a Device the caller never gave overrides
# marshals null here, and the controller rejects that -- measured, and it
# meant such a Device could not be written at all. Send [] instead, which
# means what nil means: this device has no port overrides.
[Device.field.port_overrides]
