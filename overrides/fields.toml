# A slice serialized unconditionally marshals as null when the caller has not
# set it, and the controller answers api.err.InvalidPayload for a null here.
# The controller does not return the key either, so a WLAN read back through
# the client always carried a null it never came with, and every
# read-modify-write of a WLAN was rejected outright -- measured on 10.4.57 by
# bisecting the round-trip payload one key at a time.
#
# omitempty drops it when empty. That also makes an explicitly empty schedule
# inexpressible, which is a smaller loss than every write failing.
[WLAN.field.schedule_with_duration]
omitempty = true

# Removed in v7, retained for backwards compatibility.
[SettingUsg.field.mdns_enabled]
add = true
doc = "Deprecated: removed in UniFi Network 7; retained for backwards compatibility."
name = "MdnsEnabled"
type = "bool"

# querier_addresses changed wire shape in 10.x: pre-10.x controllers (and
# databases upgraded from them) carry an array of address strings, 10.x an
# array of {mac, network_id, querier_address} objects. Decode elements
# tolerantly via a hand-written helper in the settings package.
[SettingIgmpSnooping.field.querier_addresses]
unmarshal_type = "json.RawMessage"
unmarshal_func = "querierAddressesFromRaw"

