# Declarative resource and field overrides, applied on top of the extracted
# schema. Three kinds of entry:
#
#   [Resource]                REST path when it differs from the lowercased
#                             schema file name
#   [Resource.field.<wire>]   shape pins for a schema-defined field (matched
#                             by wire/JSON name on the top-level struct)
#   [Resource.field.<wire>]   with add = true: compat or manual fields the
#                             schema does not (or no longer does) define;
#                             ignored when the schema defines the field, so
#                             the schema's validation wins when it exists
#
# Preference ownership is not overridden here: every auto|manual measurement
# lives in the ownership and uos_pins sections of schemas/behavior.json,
# written by the probes under BEHAVIOR_WRITE=1.
#
# Field entries are applied AFTER the resource's FieldProcessor, so they
# always win. Anything conditional on the schema-derived type, pattern-based
# renames, or nested fields stays in the FieldProcessor cases in main.go —
# see the "Override layers" section of schemas/README.md.
#
# When maintaining the v2 definitions in resources/, Ubiquiti's official
# Integration API spec (https://developer.ui.com/network/<ver>/openapi.json)
# is a useful *semantic* reference for the firewall zone/policy domains — but
# it describes a different API (/proxy/network/integration, camelCase wire
# names), so shapes cannot be copied from it verbatim.

[DNSRecord]
path = "static-dns"

# Definition imported from ubiquiti-community/unifi-api (see the README in
# this directory). cleanName would render device_macs as DeviceMACs; pin the
# name the hand-written type established so consumers don't break. Both
# fields always serialize (an empty device list must reach the wire as []).
[APGroup.field.device_macs]
name = "DeviceMacs"
omitempty = false
nil_as_empty = true

[APGroup.field.name]
omitempty = false

# The site's default AP group carries both of these, and the write DTO
# rejects them: measured on 10.4.57, a PUT of the default group back verbatim
# answers HTTP 400 with "hiddenId: must be null" and "nonDeletable: must be
# false". Reading the default group and writing it back is the ordinary way
# to edit its membership, so without this that is impossible. readonly keeps
# them unmarshalling and drops them from the write, exactly as on
# FirewallZone.
[APGroup.field.attr_hidden_id]
readonly = true

[APGroup.field.attr_no_delete]
readonly = true

# True-v2 object: the wire uses "id" (not "_id") and carries no site_id or
# attr_* envelope. Definition imported from ubiquiti-community/unifi-api
# (see resources/../README.md).
# The collection is asymmetric, measured on 10.4.57: create, read-one, update
# and delete are served by the singular path, and only the list is served by
# the plural one. The client used the plural path throughout, so every verb
# except the list was broken -- create answered 405 and the rest 404.
[NetworkMembersGroup]
path = "network-members-group"
list_path = "network-members-groups"

[NetworkMembersGroup.field._id]
json = "id"

[NetworkMembersGroup.field.site_id]
remove = true

[NetworkMembersGroup.field.attr_hidden]
remove = true

[NetworkMembersGroup.field.attr_hidden_id]
remove = true

[NetworkMembersGroup.field.attr_no_delete]
remove = true

[NetworkMembersGroup.field.attr_no_edit]
remove = true

# Always serialize, matching the previous hand-written wire behavior.
[NetworkMembersGroup.field.name]
omitempty = false

[NetworkMembersGroup.field.members]
omitempty = false
nil_as_empty = true

[NetworkMembersGroup.field.type]
omitempty = false

# native_networkconf_id keeps omitempty, and both directions of that choice
# are measured. An explicit "" on create suppresses the controller's
# native-network auto-assignment (provider acceptance, v1.105.0 regression),
# so unconditional serialization is wrong. Omitting "" on a plain update
# cannot clear the native VLAN (terraform-provider-unifi #383, upstream
# #65) -- that direction goes through the masked update, which force-sends
# the zero value for selected fields. Do not pin omitempty = false here
# again without re-measuring create.

[FirewallPolicy]
path = "firewall-policies"

[OSPFRouter]
path = "ospf/router"

[TrafficRoute]
path = "trafficroutes"

[BGPConfig]
path = "bgp/config"

# Published in v1.33.43+ from a hand-written schema; the controller does not
# describe this resource in its field spec.
[ContentFiltering]
path = "content-filtering"

# The zone's read and write shapes differ, which is why several fields below
# are read-only. Measured against 10.4.57 on 2026-07-25 by posting each field
# in turn and reading the rejection: the write DTO
# (com.ubnt.g.b.t.AcrQJeJCScLn, shared by POST and PUT) accepts exactly _id,
# name and network_ids, and answers HTTP 400 "Unrecognized field <x>" for
# every other key -- including cloud_template, default_zone, external_id and
# zone_key, all of which the GET emits. Model new fields from the read shape
# and expect them to be unwritable.
[FirewallZone]
path = "firewall/zone"

# Everything the controller reports but refuses on a write. readonly keeps
# them unmarshalling while dropping them from the generated MarshalJSON, so a
# zone read from the controller can be edited and written straight back.
#
# omitempty alone cannot do this. default_zone is a *bool, so any read leaves
# it non-nil and it serializes anyway (terraform-provider-unifi#310 saw the
# create half of this); external_id is always populated on a read. The rest
# are empty today and would break the same way the day the controller starts
# filling them in.
[FirewallZone.field.default_zone]
omitempty = true
pointer = true
readonly = true

[FirewallZone.field.external_id]
readonly = true

[FirewallZone.field.cloud_template]
readonly = true

[FirewallZone.field.zone_key]
readonly = true

[FirewallZone.field.site_id]
readonly = true

[FirewallZone.field.attr_hidden]
readonly = true

[FirewallZone.field.attr_hidden_id]
readonly = true

[FirewallZone.field.attr_no_delete]
readonly = true

[FirewallZone.field.attr_no_edit]
readonly = true

# network_ids must always be present in the create body: the v2
# firewall/zone POST returns HTTP 500 when the field is omitted, and an
# empty list must serialize as "network_ids":[].
[FirewallZone.field.network_ids]
omitempty = false
nil_as_empty = true

