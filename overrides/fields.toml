# Every numeric field below is measured decoding both a JSON number and a
# quoted string across controller builds (TestGetHealth_MixedNumberRepresentations),
# which is exactly what types.Number exists for. A bare numeric validation
# infers *int64 with a types.Number-typed shadow field for that tolerant
# decode, which is right everywhere else but throws the tolerance away right
# after using it. Pin type + pointer=false to hold the field at types.Number
# itself, and pass the shadow straight through with a no-op decode func:
# unmarshal_func always wins over the inferred shadow type, so this is the
# one way to keep a field decoding through types.Number's own UnmarshalJSON
