when:
  - event: manual
  - event: push
    branch: emdash/control-plane-completion

labels:
  pool: skunkworks

steps:
  - name: compatibility-campaigns
    image: golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
    commands:
      - apt-get update
      - apt-get install --yes --no-install-recommends docker.io jq
      - go mod download all
      - GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local go test ./control/dnsrecord ./internal/campaign ./cmd/scout ./cmd/campaign ./cmd/campaign-receipt ./cmd/provisioner-receipt -count=1
      - GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local go generate ./scout ./campaigns
      - mkdir -p /tmp/go-unifi-campaign-run-1
      - cp campaigns/network-10.4.57/dns_record.attestation.json /tmp/go-unifi-campaign-run-1/dns_record.attestation.json
      - cp campaigns/network-10.4.57/dns_record.mutation-attestation.json /tmp/go-unifi-campaign-run-1/dns_record.mutation-attestation.json
      - GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local go generate ./scout ./campaigns
      - cmp /tmp/go-unifi-campaign-run-1/dns_record.attestation.json campaigns/network-10.4.57/dns_record.attestation.json
      - cmp /tmp/go-unifi-campaign-run-1/dns_record.mutation-attestation.json campaigns/network-10.4.57/dns_record.mutation-attestation.json
      - git diff --exit-code -- catalogs campaigns
      - jq -e '.admission.state == "admitted"' catalogs/network-10.4.57/dns_record.admitted-catalog.json
      - jq -e '.classification == "unchanged" and .promotion == "review_required" and .candidate_only == true and (.inputs.baseline_catalog_sha256 != .inputs.candidate_catalog_sha256)' campaigns/network-10.4.57/dns_record.attestation.json
      - jq -e '.classification == "capture_invalid" and .promotion == "review_required" and .candidate_only == true and .conflicts[0].field == "vendor_flag"' campaigns/network-10.4.57/dns_record.mutation-attestation.json
      - jq -e 'all(.profiles[] | select(.class == "persisted_single_hop" or .class == "long_lived_multi_hop"); .state == "uncovered")' campaigns/network-10.4.57/dns_record.profile-matrix.json
      - |
        go run ./cmd/campaign-receipt \
          -workflow .woodpecker/m4-compatibility-campaigns.yml \
          -controller-fingerprint "$(jq -er '.target.controller_fingerprint' catalogs/network-10.4.57/dns_record.catalog.json)" \
          -output /tmp/dns_record.runner-execution-receipt.json
        GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local go run ./cmd/campaign \
          -campaign-id network-10.4.57-dns-record-runner \
          -profile-class fresh_seeded \
          -builder-image golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651 \
          -baseline catalogs/network-10.4.57/dns_record.admitted-catalog.json \
          -admission-receipt catalogs/network-10.4.57/dns_record.admission-receipt.json \
          -candidate catalogs/network-10.4.57/dns_record.catalog.json \
          -receipt catalogs/network-10.4.57/dns_record.scenario-receipt.json \
          -execution-receipt /tmp/dns_record.runner-execution-receipt.json \
          -runner-workflow .woodpecker/m4-compatibility-campaigns.yml \
          -attempt-ledger /tmp/dns_record.runner-attempts.ndjson \
          -attempt-id runner-attempt-1 \
          -elapsed-milliseconds 0 \
          -decision "runner-measured builder with fixture-scoped controller" \
          -output /tmp/dns_record.runner-attestation.json
        jq -e '.classification == "unchanged" and .candidate_only == true and .execution_mode == "runner" and .builder_image_digest == "golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651"' /tmp/dns_record.runner-attestation.json
        jq -e -s 'length == 2 and .[0].state == "started" and .[1].state == "succeeded"' /tmp/dns_record.runner-attempts.ndjson
      - if [ "${CAMPAIGN_LIVE:-0}" = "1" ]; then ./campaigns/run-live.sh; fi
