# Capture -> generate -> push. Deliberately does NOT open a pull request.
#
# The campaign opens it, because that is what makes the gate fail closed: no
# campaign means no PR, and a rejected classification means no PR. A status
# check on an already-open PR fails open when the gate never runs, which is
# what the GitHub arrangement this replaces does today.
#
# Manual inputs arrive through Woodpecker's template interpolation as
# ${artifact_url} and friends. That is the same substitution which resolved
# ${CAMPAIGN_LIVE:-0} to its default before any shell existed -- anything the
# SHELL must evaluate has to be written $${...}. Same rule, both directions.
#
#   woodpecker-cli pipeline create --branch main infra/go-unifi \
#     --var artifact_url=... --var build_identity=... --var network_version=...
when:
  - event: manual

labels:
  pool: skunkworks

steps:
  - name: capture-and-generate
    image: golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
    environment:
      FORGEJO_BASE_URL:
        from_secret: forgejo_base_url
      FORGEJO_USER:
        from_secret: forgejo_ci_user
      FORGEJO_TOKEN:
        from_secret: forgejo_ci_token
    commands:
      # Every `event: manual` pipeline in this repository fires on every manual
      # trigger, so an onboarding run also started a capture with no artifact
      # URL and failed. Workflow-level `when: evaluate` is the documented way to
      # scope that and it cannot be used here: this server fails to compile it,
      # and a workflow that fails to compile errors the WHOLE pipeline, taking
      # every other workflow with it. Measured on a throwaway branch -- with the
      # guard present not even an unguarded control step ran.
      #
      # So filter inside the step, using the substitution that does work.
      - |
        if [ -n "${onboard_version}" ]; then
          echo "this trigger is onboarding Network ${onboard_version}, not a capture"
          exit 0
        fi
      - apt-get update
      - apt-get install --yes --no-install-recommends ca-certificates curl jq git
      - export GO_UNIFI_CONTENT_STORE="$${CI_WORKSPACE}/.content-store"
      - |
        go run ./cmd/schema-capture \
          -url="${artifact_url}" \
          -media-type="${media_type}" \
          -product="${product}" \
          -build="${build_identity}" \
          -network-version="${network_version}" \
          -uos-version="${uos_version}" \
          -captured-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # Not a bare `go generate ./...`. It keeps going after a package's
      # generator fails, so a failed step ends with several hundred lines of a
      # LATER package succeeding -- pipeline 44 died at line 121 of 604 and its
      # last three lines read "Generated specification: ...". `tail` is the
      # first thing anyone runs on a red step, and it was showing work that
      # happened after the thing that killed the run. Repeat the errors last so
      # the end of the log is the reason it stopped.
      - |
        if ! go generate ./... >/tmp/generate.log 2>&1; then
          cat /tmp/generate.log
          echo
          echo "=== go generate FAILED. The errors, repeated so they are the last thing here: ==="
          grep -nE 'exit status|does not pin|does not match|refus|cannot|error|panic' /tmp/generate.log |
            grep -v '^[0-9]*:normalize ' | tail -20
          exit 1
        fi
        cat /tmp/generate.log
      - go run ./cmd/rebuild-manifest -root=. > schemas/GENERATED_SHA256
      - mkdir -p /tmp/apidiff
      - bash .woodpecker/scripts/apidiff-check.sh /tmp/apidiff
      # The branch is pushed; the campaign fires on that push and decides
      # whether a pull request may exist.
      - git config user.name "$${FORGEJO_USER}"
      - git config user.email "$${FORGEJO_USER}@users.noreply.localhost"
      - git checkout -B schema-update
      - git add -A
      # No diff means no candidate. Committing nothing and pushing anyway
      # creates schema-update at main's tip, which is a ref change, which fires
      # a full live campaign against a tree identical to main and then fails
      # trying to open a pull request with no changes in it. Stop here instead.
      - |
        if git diff --cached --quiet; then
          echo "generation produced no diff at ${build_identity}; nothing to propose"
          echo "no branch pushed, no campaign fired"
          exit 0
        fi
      - git commit -m "schemas:$(printf ' ')update to ${product} ${build_identity}"
      # Credentials must be in the URL. The bare base URL fails with
      # "could not read Username" (rc 128) -- measured, not assumed: the step
      # inherits a read-scoped netrc, not a writable one. Woodpecker masks the
      # secret in logs. Same construction auto-release.sh uses.
      - |
        authed="https://$${FORGEJO_USER}:$${FORGEJO_TOKEN}@$${FORGEJO_BASE_URL#https://}"
        git push --force "$${authed%/}/infra/go-unifi.git" schema-update
