---
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
      force:
        description: >-
          Release even though the latest integration run on main is not
          green. Use only for a red that is understood and accepted, and
          say why in the release notes.
        required: false
        type: boolean
        default: false

jobs:
  # A tag used to publish whatever the integration suite said: v1.111.0
  # shipped while the nightly had been red for two days, and nothing
  # objected. The unit tests below re-run on the tag itself, but the
  # docker-backed integration suite runs nightly against main, so this
  # asks for its most recent verdict instead of re-running it.
  #
  # The override is a workflow_dispatch input, not an environment secret
  # or a magic tag name: forcing a release over a red suite should be a
  # deliberate act with a paper trail.
  preflight:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Latest integration verdict on main
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY"             --workflow integration.yaml --branch main --limit 20             --json conclusion,status             --jq '[.[] | select(.status == "completed")][0].conclusion // "none"')
          echo "latest completed integration run on main: ${conclusion}"
          if [ "$conclusion" = "success" ]; then
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "::warning::releasing over integration=${conclusion} because force was set"
            exit 0
          fi
          echo "::error::integration on main is ${conclusion}, not success. Understand it, fix it or re-run it -- or dispatch this workflow with force=true to accept it deliberately."
          exit 1

  goreleaser:
    # Releases are cut at the public publish point. A deployment whose only
    # forge is elsewhere changes this guard.
    if: github.server_url == 'https://github.com'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # Branch protection gates merges to main, but nothing re-checks a tag,
      # so gate the release itself: a tag on an untested or off-main commit
      # fails here instead of publishing. Unit and schema tests only — the
      # docker-backed integration gate ran when the code merged.
      - name: Run tests
        run: go test ./...

      - name: Read the controller train
        run: echo "CONTROLLER_VERSION=$(cat schemas/VERSION)" >> "$GITHUB_ENV"

      # The release notes carry both diff surfaces: apidiff for the Go API
      # and the always-serialized baseline for the wire. A previous tag may
      # not exist in a fresh history; say so instead of failing.
      - name: Summarize API and wire changes
        run: |
          set -eu
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n1 || true)"
          {
            echo 'RELEASE_DIFF_SUMMARY<<DIFF_EOF'
            if [ -z "$previous" ]; then
              echo "No previous release tag in this history to diff against."
            else
              go run ./cmd/apidiff -base "$previous" -markdown
            fi
            echo 'DIFF_EOF'
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
