---
name: capture

on:
  workflow_dispatch:
    inputs:
      # The capture inputs are enforced by the fields job, not the form: a
      # record_only dispatch leaves them empty on purpose.
      artifact_url:
        description: Exact controller artifact URL
        required: false
        type: string
      product:
        description: Controller product identity
        required: true
        default: unifi-controller
        type: string
      build_identity:
        description: Full controller build identity
        required: false
        type: string
      network_version:
        description: Expected UniFi Network version
        required: false
        type: string
      uos_version:
        description: UniFi OS version, when applicable
        required: false
        type: string
      media_type:
        description: Controller artifact media type
        required: true
        default: application/vnd.debian.binary-package
        type: string
      record_only:
        description: >-
          Skip capture; re-measure behaviour onto the open schema-update PR
          (for a sim image published after the capture ran)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fields:
    # Runs on the GitHub mirror only. Forgejo executes .github/workflows
    # too, so without this guard enabling Actions doubles every job onto
    # runners that lack this workflow's environment.
    if: github.server_url == 'https://github.com' && !inputs.record_only
    runs-on: ubuntu-latest
    # Bounds the damage of a malformed artifact: the download and nested
    # decompression are otherwise unbounded work.
    timeout-minutes: 45
    outputs:
      # Empty when the capture changed nothing and opened no PR -- then the
      # behavior job has nothing to record onto and skips.
      pr: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      # The dispatch form cannot require these (a record_only dispatch
      # leaves them empty), so the job does.
      - name: Require capture inputs
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          BUILD_IDENTITY: ${{ inputs.build_identity }}
          NETWORK_VERSION: ${{ inputs.network_version }}
        run: |
          missing=""
          [ -n "$ARTIFACT_URL" ] || missing="$missing artifact_url"
          [ -n "$BUILD_IDENTITY" ] || missing="$missing build_identity"
          [ -n "$NETWORK_VERSION" ] || missing="$missing network_version"
          if [ -n "$missing" ]; then
            echo "::error::capture requires$missing (or dispatch with record_only=true to only re-measure behaviour)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the release tags are available as the API
          # compatibility baseline.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Prepare ephemeral content store
        run: echo "GO_UNIFI_CONTENT_STORE=$RUNNER_TEMP/go-unifi-content-store" >> "$GITHUB_ENV"

      # Capture is explicit. The job never queries "latest," and its ephemeral
      # store is not promotion evidence. A maintainer must retain the exact
      # digest in the restricted store before merging the proposed lock.
      - name: Capture selected controller artifact
        id: capture
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          PRODUCT: ${{ inputs.product }}
          BUILD_IDENTITY: ${{ inputs.build_identity }}
          NETWORK_VERSION: ${{ inputs.network_version }}
          UOS_VERSION: ${{ inputs.uos_version }}
          MEDIA_TYPE: ${{ inputs.media_type }}
        run: |
          set -euo pipefail
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go run ./cmd/schema-capture \
            -url="$ARTIFACT_URL" \
            -media-type="$MEDIA_TYPE" \
            -product="$PRODUCT" \
            -build="$BUILD_IDENTITY" \
            -network-version="$NETWORK_VERSION" \
            -uos-version="$UOS_VERSION" \
            -captured-at="$captured_at"
          echo "identity=${PRODUCT} ${BUILD_IDENTITY}" >> "$GITHUB_OUTPUT"

      # The regeneration diff is the discovered surface: whatever the new
      # capture changes shows up as the working-tree diff on this PR.
      # Generation re-stamps the lock digests and GENERATED_SHA256 itself.
      - name: Generate
        run: go generate ./...

      # Controller schema drift can break the public Go API (removed
      # fields, type changes such as []string -> []struct). Compare the
      # regenerated working tree against the latest release tag with
      # apidiff. The baseline is extracted from the local tag via git
      # archive rather than fetched through the module proxy: gorelease
      # cannot do that, and the proxy may not yet serve (or may have
      # cached a 404 for) a tag that auto-release pushed recently.
      # cmd/ holds main packages, which are not importable API, so
      # incompatibilities there are ignored.
      - name: Check API compatibility
        id: compat
        run: go run ./cmd/apidiff

      # A PR created with the workflow token fires no workflows: the schema
      # PR would sit ungated (or hang on required checks) with nothing
      # reporting. Refuse to open one without a real credential.
      - name: Require a PR credential
        env:
          HAS_UPDATE_TOKEN: ${{ secrets.SCHEMA_UPDATE_TOKEN }}
          HAS_BOT_APP: ${{ vars.SCHEMA_BOT_APP_ID }}
        run: |
          if [ -z "$HAS_BOT_APP" ] && [ -z "$HAS_UPDATE_TOKEN" ]; then
            echo "::error::configure the schema-bot app (SCHEMA_BOT_APP_ID + SCHEMA_BOT_PRIVATE_KEY) or SCHEMA_UPDATE_TOKEN; a github.token PR triggers no CI"
            exit 1
          fi

      # Prefer a short-lived schema-bot token; SCHEMA_UPDATE_TOKEN is the
      # fallback when the app is not configured.
      - name: Mint bot token
        if: vars.SCHEMA_BOT_APP_ID != ''
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SCHEMA_BOT_APP_ID }}
          private-key: ${{ secrets.SCHEMA_BOT_PRIVATE_KEY }}

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.bot.outputs.token || secrets.SCHEMA_UPDATE_TOKEN }}
          branch: schema-update
          delete-branch: true
          title: Update to ${{ steps.capture.outputs.identity }}
          commit-message: |
            schemas: update to ${{ steps.capture.outputs.identity }}

            Regenerate from the operator-selected controller artifact and
            record its immutable capture lock.
          body: |
            Schema refresh for `${{ steps.capture.outputs.identity }}`.

            Before merge, retain the captured digest in the restricted store
            and review the lock, generated API diff, and integration evidence.

            ${{ steps.compat.outputs.summary }}

      # Breaking drift still gets a PR, but a human decides the merge and
      # the version bump. The label makes the state visible at a glance;
      # the apidiff output is already in the PR body (updated in place on
      # every rerun, unlike comments, which would pile up).
      - name: Flag breaking change
        if: >-
          steps.pr.outputs.pull-request-number != '' &&
          steps.compat.outputs.breaking == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.SCHEMA_UPDATE_TOKEN || github.token }}
        run: |
          gh label create breaking-schema-change \
            --repo "${{ github.repository }}" \
            --color B60205 \
            --description "Schema drift breaks the public Go API" \
            --force
          gh pr edit "${{ steps.pr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}" \
            --add-label breaking-schema-change

  # Re-measure the behaviour artifact on the schema-update branch the capture
  # just pushed. schemas/behavior.json records what one exact controller
  # build was measured doing, so a new pin re-runs the recording probes
  # rather than letting the PR carry the previous build's measurements as if
  # they were fresh.
  #
  # The pinned version's -sim image is built by unifi-containers, a separate
  # lane, so a fresh pin may have no image yet. That is a red job here, never
  # a skip: green means re-measured, red means "image not published yet" (the
  # capture PR still opens from the fields job), and the status comment below
  # says which without any log reading. Once the image exists, dispatch this
  # workflow with record_only=true to re-measure onto the same PR branch.
  behavior:
    needs: fields
    if: >-
      always() && github.server_url == 'https://github.com' &&
      (inputs.record_only || (needs.fields.result == 'success' &&
      needs.fields.outputs.pr != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Same posture as the fields job: a push made with github.token fires
      # no workflows, so the re-measured commit would sit ungated on the PR.
      - name: Require a PR credential
        env:
          HAS_UPDATE_TOKEN: ${{ secrets.SCHEMA_UPDATE_TOKEN }}
          HAS_BOT_APP: ${{ vars.SCHEMA_BOT_APP_ID }}
        run: |
          if [ -z "$HAS_BOT_APP" ] && [ -z "$HAS_UPDATE_TOKEN" ]; then
            echo "::error::configure the schema-bot app (SCHEMA_BOT_APP_ID + SCHEMA_BOT_PRIVATE_KEY) or SCHEMA_UPDATE_TOKEN; a github.token push triggers no CI"
            exit 1
          fi

      - name: Mint bot token
        if: vars.SCHEMA_BOT_APP_ID != ''
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SCHEMA_BOT_APP_ID }}
          private-key: ${{ secrets.SCHEMA_BOT_PRIVATE_KEY }}

      # The branch create-pull-request maintains. On a record_only dispatch it
      # must already exist; a missing branch fails checkout, the honest
      # answer to "nothing to record onto".
      - name: Checkout schema-update branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: schema-update
          token: ${{ steps.bot.outputs.token || secrets.SCHEMA_UPDATE_TOKEN }}

      - name: Locate the schema PR
        id: locate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.SCHEMA_UPDATE_TOKEN || github.token }}
          FIELDS_PR: ${{ needs.fields.outputs.pr }}
        run: |
          set -euo pipefail
          n="$FIELDS_PR"
          if [ -z "$n" ]; then
            n="$(gh pr list --repo "${{ github.repository }}" --head schema-update --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -z "$n" ]; then
            echo "::error::no open schema-update PR to record onto; run a capture first"
            exit 1
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # Same tag derivation as the integration suite. Probing the manifest
      # first turns "image not built yet" into a one-line diagnosis instead
      # of a testcontainers pull failure buried in a probe transcript.
      - name: Require the pinned controller's sim image
        id: image
        run: |
          set -euo pipefail
          version="$(cat schemas/VERSION)"
          image="ghcr.io/jamesbraid/unifi-network:${version}-sim"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          if ! docker manifest inspect "$image"; then
            echo "::error::${image} is not published (unifi-containers builds it); re-run capture with record_only=true once it exists"
            exit 1
          fi

      # Every probe that rewrites the artifact under BEHAVIOR_WRITE=1, found
      # by asking the source rather than by keeping a list here: a name that
      # drifts out of a hand-written -run regex makes this job match nothing
      # and record nothing while still reporting success. -count=1 because a
      # cached pass records nothing either.
      - name: Re-measure behaviour
        id: record
        env:
          UNIFI_TEST_IMAGE: ${{ steps.image.outputs.tag }}
          UNIFI_TEST_EXPECT_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          run=$(grep -l 'BEHAVIOR_WRITE' unifi/*_integration_test.go \
            | xargs grep -hoE '^func TestIntegration[A-Za-z0-9_]+' \
            | sed 's/^func //' | sort -u | paste -sd '|' -)
          if [ -z "$run" ]; then
            echo "::error::no artifact-writing probes found; the BEHAVIOR_WRITE convention moved" >&2
            exit 1
          fi
          echo "recording with: $run"
          UNIFI_TEST_REQUIRE=1 BEHAVIOR_WRITE=1 \
            go test -tags integration -p 1 -timeout 40m -v -count=1 \
            ./unifi/ -run "^($run)\$"

      # Generation needs the extracted field definitions, which a fresh
      # checkout lacks; fetch the locked artifact into an ephemeral store the
      # same way the rebuild workflow does.
      - name: Fetch the locked artifact
        id: fetch
        run: |
          set -eu
          url=$(jq -er '.source.location' schemas/capture.lock.json)
          sha=$(jq -er '.source.sha256' schemas/capture.lock.json)
          store="$RUNNER_TEMP/content-store"
          mkdir -p "$store/sha256"
          curl --fail --location --silent --show-error --output "$store/sha256/$sha" "$url"
          echo "$sha  $store/sha256/$sha" | sha256sum --check -
          echo "GO_UNIFI_CONTENT_STORE=$store" >> "$GITHUB_ENV"

      # behavior.json is a generator input, so the re-measurement re-locks
      # first (generation refuses a tree whose input digests mismatch the
      # lock), regenerates, and re-digests the output.
      - name: Re-lock and regenerate
        id: regen
        run: |
          set -euo pipefail
          go run ./cmd/relock
          go generate ./...
          go run ./cmd/rebuild-manifest -root=. > schemas/GENERATED_SHA256

      - name: Push the re-measurement
        id: push
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "re-measurement changed nothing; the branch is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898062+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "schemas: re-measure behaviour against ${VERSION}" \
            -m "The artifact records what one exact controller build was measured doing, so a new pin re-runs the recording probes rather than carrying the previous build's answers forward. Re-locked and regenerated because the artifact is a generator input."
          git push origin HEAD:schema-update

      # One status comment, edited in place on reruns (a comment per run
      # would pile up). It mirrors the job's color so the PR states plainly
      # whether its behavior.json was measured against the pinned build.
      - name: Report re-measurement on the PR
        if: always() && steps.locate.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.SCHEMA_UPDATE_TOKEN || github.token }}
          PR: ${{ steps.locate.outputs.number }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ steps.image.outcome }}" = failure ]; then
            body="**Behaviour NOT re-measured**: \`${IMAGE}\` is not published yet (unifi-containers builds it), so schemas/behavior.json still holds the previous controller's measurements. Re-run the capture workflow with record_only=true once the image exists."
          elif [ "${{ steps.record.outcome }}" = failure ]; then
            body="**Behaviour re-measurement failed**: the recording probes went red against \`${IMAGE}\`; see the capture run."
          elif [ "${{ steps.push.outcome }}" = success ]; then
            # The push proves the whole chain landed: it only runs after the
            # fetch/relock/regenerate steps succeed.
            body="Behaviour re-measured: schemas/behavior.json on this PR was recorded against \`${IMAGE}\`."
          elif [ "${{ steps.record.outcome }}" = success ]; then
            body="**Behaviour re-measurement did not land**: recording succeeded but a later step failed; see the capture run."
          else
            exit 0
          fi
          gh pr comment "$PR" --repo "${{ github.repository }}" --edit-last --create-if-none --body "$body"
