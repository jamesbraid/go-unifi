---
name: CI/CD Checks

on:
  pull_request: {}
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # Public CI cannot read the retained controller artifact. It verifies
      # that the lock names this commit's generator inputs and that every
      # committed generated file still matches the accepted output digest.
      # The native amd64 hermetic gate performs the full two-run extraction.
      - name: Verify capture lock and generated output
        run: |
          go run ./cmd/fields -verify-lock-only
          generated="$(go run ./cmd/rebuild-manifest -root=.)"
          accepted="$(cat schemas/GENERATED_SHA256)"
          if [ "$generated" != "$accepted" ]; then
            echo "generated output digest is $generated; expected $accepted" >&2
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than latest so a new golangci-lint release cannot
          # fail an unrelated PR on a rule that did not exist when it opened.
          version: v2.12.2
          args: --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # Blocking unit and schema checks.
      - name: Run tests
        run: go test ./...

  yamllint:
    name: yamllint
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
