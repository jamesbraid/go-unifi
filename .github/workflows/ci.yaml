---
name: CI/CD Checks

on:
  pull_request: {}
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: read

# These jobs run on both forges: here they check pull requests, and on the
# GitHub mirror they keep the mirrored main and tags truthful. None of them
# needs a container daemon, so on the forge they ask for the runner tier
# that has none.

jobs:
  generate:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'podman-general' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # Public CI cannot read the retained controller artifact. It verifies
      # that the lock names this commit's generator inputs and that every
      # committed generated file still matches the accepted output digest.
      # The rebuild workflow performs the full from-scratch regenerate-and-diff.
      - name: Verify capture lock and generated output
        run: |
          go run ./cmd/fields -verify-lock-only
          generated="$(go run ./cmd/rebuild-manifest -root=.)"
          accepted="$(cat schemas/GENERATED_SHA256)"
          if [ "$generated" != "$accepted" ]; then
            echo "generated output digest is $generated; expected $accepted" >&2
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'podman-general' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than latest so a new golangci-lint release cannot
          # fail an unrelated PR on a rule that did not exist when it opened.
          # Must stay >= the go.mod toolchain: golangci-lint refuses a module
          # whose target Go version is newer than the one its binary was built
          # with.
          #
          # Renovate reads the action's own ref above but not the inputs
          # handed to it, so this line is invisible to it without an opt-in.
          # The trailing marker is that opt-in: it puts the pin under a custom
          # manager in renovate.json, which is what lets one rule there group
          # it with the toolchain into a single pull request. Delete the marker
          # and this pin quietly stops moving with the toolchain.
          version: v2.13.2 # renovate: datasource=github-releases depName=golangci/golangci-lint
          args: --timeout=10m

  test:
    name: Test
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'podman-general' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      # Blocking unit and schema checks.
      - name: Run tests
        run: go test ./...

      # The integration tests are excluded from the run above by their build
      # tag, so nothing here compiles them: a helper they call can be deleted
      # and every gate stays green. Vet type-checks them without needing a
      # controller.
      - name: Type-check the integration tests
        run: go vet -tags integration ./...

  yamllint:
    name: yamllint
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'podman-general' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # uv rather than a yamllint action: the forge's daemonless runner image
      # carries neither pip nor pipx.
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uvx" yamllint -c .yamllint .
